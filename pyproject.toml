[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plus-ultra-scientia"
version = "0.1.0"
description = "Personal research pipeline: discover papers on a topic and fetch legally available full text."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pypdf>=5", "anthropic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scientia = "scientia.cli:main"

[tool.setuptools.packages.find]
include = ["scientia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
